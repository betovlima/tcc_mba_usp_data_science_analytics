name: Validate Yahoo backtest and materialize Excel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-yahoo-excel.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Yahoo backtest
        run: python backtest.py

      - name: Build Excel workbook
        run: python analysis/build_excel.py

      - name: Validate asset worksheets
        shell: python
        run: |
          from openpyxl import load_workbook
          from tcc_engine.config import ASSETS
          path = 'analysis/tcc_backtest_output_analysis.xlsx'
          wb = load_workbook(path, read_only=True, data_only=False)
          missing = [symbol for symbol in ASSETS if symbol not in wb.sheetnames]
          if missing:
              raise SystemExit('Missing asset worksheets: ' + ', '.join(missing))
          for symbol in ASSETS:
              ws = wb[symbol]
              headers = [ws.cell(1, col).value for col in range(1, 10)]
              expected = ['Date', 'Open', 'High', 'Low', 'Close', 'Volume', 'Daily Return', 'Running Peak', 'Drawdown']
              if headers != expected:
                  raise SystemExit(f'{symbol}: invalid headers: {headers}')
              if ws.max_row < 2:
                  raise SystemExit(f'{symbol}: empty worksheet')
          print(f'Validated {len(ASSETS)} asset worksheets; total sheets={len(wb.sheetnames)}')

      - name: Commit generated workbook
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f analysis/tcc_backtest_output_analysis.xlsx
          if git diff --cached --quiet; then
            echo 'Workbook unchanged.'
            exit 0
          fi
          git commit -m 'docs: refresh Yahoo Excel audit workbook'
          git push

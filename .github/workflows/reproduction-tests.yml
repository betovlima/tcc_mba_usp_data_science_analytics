name: reproduction-tests

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
      - "fix/**"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff static analysis
        run: python -m ruff check engine reproducao reproduzir_experimento_spyder.py tests --select F401,F811,F821,F841

      - name: Run tests
        run: python -m pytest -q

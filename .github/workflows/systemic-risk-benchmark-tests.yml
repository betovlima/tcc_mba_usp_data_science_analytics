name: Systemic Risk Benchmark U75

on:
  push:
    branches:
      - "research/u75-systemic-risk-benchmark-v1"
    paths:
      - "pesquisa/benchmark_risco_sistemico_u75.py"
      - "pesquisar_risco_sistemico_comparativo_u75_spyder.py"
      - "tests/test_benchmark_risco_sistemico_u75.py"
      - ".github/workflows/systemic-risk-benchmark-tests.yml"
  pull_request:
    paths:
      - "pesquisa/benchmark_risco_sistemico_u75.py"
      - "pesquisar_risco_sistemico_comparativo_u75_spyder.py"
      - "tests/test_benchmark_risco_sistemico_u75.py"
      - ".github/workflows/systemic-risk-benchmark-tests.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt scipy
      - run: python -m ruff check pesquisa/benchmark_risco_sistemico_u75.py pesquisar_risco_sistemico_comparativo_u75_spyder.py tests/test_benchmark_risco_sistemico_u75.py --select E4,E7,E9,F
      - run: python -m pytest tests/test_benchmark_risco_sistemico_u75.py -q

name: Import standalone TCC engine

on:
  push:
    branches:
      - feature/standalone-43m-reconstruction
    paths:
      - .github/workflows/import-tcc-engine.yml

permissions:
  contents: write

jobs:
  import-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TCC branch
        uses: actions/checkout@v4
        with:
          ref: feature/standalone-43m-reconstruction
          fetch-depth: 0

      - name: Import pinned historical engine snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="17019d95bfce6f0fbcd153e097b1968d9cfce1ca"
          rm -rf .engine_source tcc_engine
          git clone --quiet --filter=blob:none --no-checkout https://github.com/betovlima/market_cycle_trader_api.git .engine_source
          git -C .engine_source checkout --quiet --detach "$SOURCE_COMMIT"

          mkdir -p tcc_engine
          for file in \
            absolute_utility_cash_gate.py \
            capital_rotation.py \
            compound_risk_overlay.py \
            concentrated_allocation.py \
            optimized_allocation.py \
            research_challengers.py \
            rotation_diagnostics.py \
            selective_opportunity.py; do
            cp ".engine_source/src/market_cycle_trader_api/engine/$file" "tcc_engine/$file"
          done

          cat > tcc_engine/__init__.py <<'PY'
          """Standalone quantitative rotation engine for the USP MBA TCC.

          Source lineage: Market Cycle Trader historical commit
          17019d95bfce6f0fbcd153e097b1968d9cfce1ca.

          The source is vendored into this repository only as a development-time
          migration. Runtime code must not import or execute Market Cycle Trader.
          """

          SOURCE_COMMIT = "17019d95bfce6f0fbcd153e097b1968d9cfce1ca"
          PY

          cat > tcc_engine/execution.py <<'PY'
          """Pure execution-cost helpers used by the standalone TCC engine."""
          from __future__ import annotations

          import math
          from typing import Any

          import numpy as np


          def round_fee_to_cent(value: float) -> float:
              if not np.isfinite(value) or value <= 0:
                  return 0.0
              return math.ceil((value - 1e-12) * 100.0) / 100.0


          def calculate_reference_fees(
              side: str,
              quantity: float,
              price: float,
              config: Any,
          ) -> dict[str, float]:
              if quantity <= 0 or price <= 0:
                  return {
                      "commission_fee": 0.0,
                      "sec_fee": 0.0,
                      "taf_fee": 0.0,
                      "cat_fee": 0.0,
                      "total_fee": 0.0,
                  }
              normalized_side = side.upper()
              trade_value = quantity * price
              commission = round_fee_to_cent(trade_value * config.commission_rate)
              cat = round_fee_to_cent(quantity * config.cat_fee_per_share)
              sec = 0.0
              taf = 0.0
              if normalized_side == "SELL":
                  sec = round_fee_to_cent(trade_value * config.sec_fee_rate)
                  taf = round_fee_to_cent(
                      min(quantity * config.taf_fee_per_share, config.taf_fee_cap)
                  )
              elif normalized_side != "BUY":
                  raise ValueError(f"Unsupported side: {side}")
              return {
                  "commission_fee": commission,
                  "sec_fee": sec,
                  "taf_fee": taf,
                  "cat_fee": cat,
                  "total_fee": commission + sec + taf + cat,
              }


          def apply_slippage(price: float, side: str, config: Any) -> float:
              adjustment = config.slippage_bps / 10_000
              return price * (1 + adjustment if side == "BUY" else 1 - adjustment)
          PY

          rm -rf .engine_source

          python - <<'PY'
          from pathlib import Path

          forbidden = (
              "import market_cycle_trader_api",
              "from market_cycle_trader_api",
          )
          files = sorted(Path("tcc_engine").glob("*.py"))
          if not files:
              raise SystemExit("No engine files were imported")
          violations = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              for token in forbidden:
                  if token in text:
                      violations.append(f"{path}: {token}")
          if violations:
              raise SystemExit("Forbidden runtime imports found:\n" + "\n".join(violations))
          print(f"Imported {len(files)} standalone engine modules")
          PY

      - name: Commit imported engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tcc_engine
          if git diff --cached --quiet; then
            echo "No engine changes to commit"
            exit 0
          fi
          git commit -m "feat: vendor standalone historical rotation engine"
          git push origin HEAD:feature/standalone-43m-reconstruction

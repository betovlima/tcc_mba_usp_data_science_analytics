name: Comparar refatoracao

on:
  push:
    paths:
      - '.github/workflows/comparar-refatoracao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Preparar versao anterior
        run: git worktree add /tmp/motor_antigo d8ad8c175707759f777bcf3c2a3d2a7c423f8032

      - name: Baixar um unico conjunto de dados
        run: |
          python - <<'PY'
          import pandas as pd
          import yfinance as yf
          from tcc_engine.configuracao import ATIVOS, DATA_INICIO, DATA_FIM

          data_fim = (pd.Timestamp(DATA_FIM) + pd.Timedelta(days=1)).strftime('%Y-%m-%d')
          partes = []
          for ativo in ATIVOS:
              quadro = yf.download(
                  ativo,
                  start=DATA_INICIO,
                  end=data_fim,
                  interval='1d',
                  auto_adjust=True,
                  actions=False,
                  progress=False,
                  threads=False,
                  repair=False,
                  keepna=False,
                  multi_level_index=False,
              )
              if quadro is None or quadro.empty:
                  raise RuntimeError(f'Sem dados para {ativo}')
              quadro = quadro.rename(columns={str(c): str(c).lower() for c in quadro.columns})
              quadro = quadro[['open', 'high', 'low', 'close', 'volume']].copy()
              quadro.index = pd.to_datetime(quadro.index, utc=True)
              quadro.index.name = 'timestamp'
              parte = quadro.reset_index()
              parte.insert(0, 'symbol', ativo)
              partes.append(parte)
          dados = pd.concat(partes, ignore_index=True)
          dados.to_csv('/tmp/dados_comuns.csv', index=False)
          print(f'DADOS_COMUNS_LINHAS={len(dados)}')
          PY

      - name: Executar motor anterior
        env:
          MCT_MODEL_THREADS_OVERRIDE: '1'
        run: |
          cd /tmp/motor_antigo
          PYTHONPATH=/tmp/motor_antigo python - <<'PY'
          import copy
          import pandas as pd
          from tcc_engine.config import CONFIG
          from tcc_engine.execution import calcular_taxas_referencia, aplicar_deslizamento
          from tcc_engine.capital_rotation import run_rotation_models

          dados = pd.read_csv('/tmp/dados_comuns.csv')
          dados['timestamp'] = pd.to_datetime(dados['timestamp'], utc=True)
          quadros = {}
          for ativo, grupo in dados.groupby('symbol', sort=False):
              quadro = grupo[['timestamp','open','high','low','close','volume']].copy()
              quadro = quadro.set_index('timestamp').sort_index()
              quadros[str(ativo)] = quadro

          ajustes = copy.deepcopy(CONFIG.research_model_settings)
          ajustes['lightgbm']['n_jobs'] = 1
          config = CONFIG.model_copy(update={
              'deterministic_execution': True,
              'numeric_thread_limit': 1,
              'research_model_settings': ajustes,
          })
          resultado = run_rotation_models(
              quadros, config, calcular_taxas_referencia, aplicar_deslizamento
          )[0]
          m = resultado.metrics
          print(f'ANTIGO_CAPITAL={float(m["strategy_ending_capital"]):.10f}')
          print(f'ANTIGO_RETORNO={float(m["strategy_return"]):.12f}')
          print(f'ANTIGO_ROTACOES={int(m["capital_rotations"])}')
          print(f'ANTIGO_SHARPE={float(m["strategy_sharpe"]):.12f}')
          print(f'ANTIGO_DD={float(m["strategy_maximum_drawdown"]):.12f}')
          print('ANTIGO_MARGENS=' + ','.join(str(x.get('effective_switch_margin')) for x in m['walk_forward_folds']))
          PY

      - name: Executar motor atual
        run: |
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH="$GITHUB_WORKSPACE" python - <<'PY'
          import pandas as pd
          from tcc_engine.configuracao import CONFIGURACAO
          from tcc_engine.execucao import calcular_taxas_referencia, aplicar_deslizamento
          from tcc_engine.rotacao_capital import executar_modelos_rotacao

          dados = pd.read_csv('/tmp/dados_comuns.csv')
          dados['timestamp'] = pd.to_datetime(dados['timestamp'], utc=True)
          quadros = {}
          for ativo, grupo in dados.groupby('symbol', sort=False):
              quadro = grupo[['timestamp','open','high','low','close','volume']].copy()
              quadro = quadro.set_index('timestamp').sort_index()
              quadros[str(ativo)] = quadro

          hiper = dict(CONFIGURACAO.hiperparametros_lightgbm)
          hiper['n_jobs'] = 1
          config = CONFIGURACAO.copiar(
              execucao_deterministica=True,
              limite_threads_numericas=1,
              hiperparametros_lightgbm=hiper,
          )
          resultado = executar_modelos_rotacao(
              quadros, config, calcular_taxas_referencia, aplicar_deslizamento
          )[0]
          m = resultado.metrics
          print(f'ATUAL_CAPITAL={float(m["strategy_ending_capital"]):.10f}')
          print(f'ATUAL_RETORNO={float(m["strategy_return"]):.12f}')
          print(f'ATUAL_ROTACOES={int(m["capital_rotations"])}')
          print(f'ATUAL_SHARPE={float(m["strategy_sharpe"]):.12f}')
          print(f'ATUAL_DD={float(m["strategy_maximum_drawdown"]):.12f}')
          print('ATUAL_MARGENS=' + ','.join(str(x.get('effective_switch_margin')) for x in m['walk_forward_folds']))
          PY

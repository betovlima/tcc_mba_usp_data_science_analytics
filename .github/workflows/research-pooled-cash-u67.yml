name: research-pooled-cash-u67

on:
  push:
    branches:
      - research/cash-reversal-protection
    paths:
      - "reproducao/piloto_cash_pooled_u67.py"
      - "tests/test_piloto_cash_pooled_u67.py"
      - ".github/workflows/research-pooled-cash-u67.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pooled_cash_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install frozen research dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests of no-lookahead and trade safeguards
        run: python -m pytest -q tests/test_piloto_cash_pooled_u67.py
      - name: Execute full pooled U67 pilot from SHA256 frozen data
        run: python -m reproducao.piloto_cash_pooled_u67 --output out/piloto_cash_pooled_u67
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-cash-pooled-u67
          path: out/piloto_cash_pooled_u67
          if-no-files-found: warn
          retention-days: 30

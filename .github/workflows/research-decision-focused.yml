name: decision-focused-experiment

on:
  push:
    branches:
      - research/decision-focused-counterfactual-v1
    paths:
      - .github/workflows/research-decision-focused.yml
      - reproducao/decision_focused.py
      - reproducao/snapshot_portatil.py
      - pesquisar_decision_focused_spyder.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate frozen snapshot manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          from reproducao.dados import SnapshotPaths, validate_snapshot
          from reproducao.snapshot_portatil import preparar_snapshot_verificado
          root = Path.cwd()
          snap, audit = preparar_snapshot_verificado(
              SnapshotPaths.research(root), root / "output/decision_focused/snapshot_verified",
          )
          validate_snapshot(snap)
          print("Frozen snapshot verified", audit)
          PY
      - name: Research regression tests
        run: python -m pytest -q tests/test_decision_focused.py
      - name: Run full comparison on frozen research data
        shell: bash
        run: |
          set -o pipefail
          python -u pesquisar_decision_focused_spyder.py 2>&1 | tee decision_focused_run.log
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decision-focused-research-v1
          if-no-files-found: warn
          retention-days: 30
          path: |
            decision_focused_run.log
            output/decision_focused/
            !output/decision_focused/snapshot_verified/**

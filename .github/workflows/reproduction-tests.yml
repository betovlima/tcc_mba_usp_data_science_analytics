name: reproduction-tests

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "docs/**"
      - "feature/**"
      - "fix/**"
      - "research/**"
      - "release/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Ruff static analysis
        run: python -m ruff check engine reproducao preparar_snapshot_u67.py reproduzir_experimento.py avaliar_elegibilidade_u67.py gerar_figuras_tcc.py tests --select F401,F811,F821,F841

      - name: Run tests
        run: python -m pytest -q

  tag_release:
    needs: tests
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'Release v1.22.1: integrar revisão do TCC')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag anotada v1.22.1
        env:
          RELEASE_TAG: v1.22.1
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "$RELEASE_TAG^{}")" = "$RELEASE_SHA"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag -a "$RELEASE_TAG" "$RELEASE_SHA" \
              -m 'Release v1.22.1: elegibilidade corrigida, referência no mesmo universo, diagnósticos e figuras verificadas'
          git push origin "refs/tags/$RELEASE_TAG"

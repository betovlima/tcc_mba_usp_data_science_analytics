name: Validar simulação Yahoo e atualizar Excel

# Validação temporária da padronização em português.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-yahoo-excel.yml'

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m py_compile backtest.py analysis/build_excel.py

      - name: Executar simulação com Yahoo
        run: python backtest.py

      - name: Gerar planilha de auditoria
        run: python analysis/build_excel.py

      - name: Validar abas dos ativos
        shell: python
        run: |
          import json
          from openpyxl import load_workbook

          with open('output/backtest_result.json', encoding='utf-8') as arquivo:
              resultado = json.load(arquivo)

          ativos = list(resultado['assets'])
          if len(ativos) != 37:
              raise SystemExit(f'Eram esperados 37 ativos; foram encontrados {len(ativos)}')

          caminho = 'analysis/tcc_backtest_output_analysis.xlsx'
          pasta = load_workbook(caminho, read_only=True, data_only=False)

          abas_gerais = [
              '00_Guia',
              '01_Indicadores',
              '02_Curva',
              '03_Janelas',
              '04_Operacoes',
              '05_Ciclos',
              '06_Ativos',
              '07_Mensal',
              '08_Dicionario',
              '09_JSON',
              '10_Reconciliacao',
              '11_Lista_Ativos',
          ]
          faltantes = [nome for nome in abas_gerais if nome not in pasta.sheetnames]
          faltantes += [ativo for ativo in ativos if ativo not in pasta.sheetnames]
          if faltantes:
              raise SystemExit('Abas ausentes: ' + ', '.join(faltantes))

          cabecalhos_esperados = [
              'Data',
              'Abertura',
              'Máxima',
              'Mínima',
              'Fechamento',
              'Volume',
              'Retorno diário',
              'Pico acumulado',
              'Queda desde o pico',
          ]
          for ativo in ativos:
              aba = pasta[ativo]
              cabecalhos = [aba.cell(1, coluna).value for coluna in range(1, 10)]
              if cabecalhos != cabecalhos_esperados:
                  raise SystemExit(f'{ativo}: cabeçalhos inválidos: {cabecalhos}')
              if aba.max_row < 2:
                  raise SystemExit(f'{ativo}: aba sem dados')

          print(f'Validadas {len(ativos)} abas de ativos; total de abas={len(pasta.sheetnames)}')

      - name: Atualizar Excel versionado
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f analysis/tcc_backtest_output_analysis.xlsx
          if git diff --cached --quiet; then
            echo 'A planilha não mudou.'
            exit 0
          fi
          git commit -m 'docs: atualizar auditoria Excel em português'
          git push
